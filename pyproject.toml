[project]
name = "cahier_doleances"
version = "0.1.0"
description = "Outil Data For Good pour visualiser et annoter les cahiers de doléances : contributions extraites des PDF, stockées en PostgreSQL et parcourues via une app Gradio."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "click>=8.1.8",
    "duckdb>=1.1.3",
    "duckdb-engine>=0.15.0",
    "gradio>=6.19.0",
    "ipykernel>=6.29.5",
    "ipython>=8.31.0",
    "ipython-sql>=0.5.0",
    "jupysql>=0.10.17",
    "matplotlib>=3.10.0",
    "pandas>=2.2.3",
    "pdfplumber>=0.11.4",
    "psycopg2-binary>=2.9.12",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "sqlalchemy>=2.0.44",
]
