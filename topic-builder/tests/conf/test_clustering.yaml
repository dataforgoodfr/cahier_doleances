embedding:
  model: BAAI/bge-small-en-v1.5
  batch_size: 32
  prefix: ""
umap:
  n_components: 5
  n_neighbors: 2
  min_dist: 0.1
  metric: cosine
  random_state: 42
hdbscan:
  max_cluster_size: 10
  min_cluster_size: 2
  min_samples: 2
  cluster_selection_epsilon: 0.05
  metric: euclidean
  cluster_selection_method: eom
