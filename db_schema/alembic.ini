# Alembic configuration for the cahiers database.
# Run from anywhere with:  alembic -c db_schema/alembic.ini <command>
# The actual DB URL is taken from the DATABASE_URL env var in env.py; the
# value below is only a fallback used when that variable is unset.

[alembic]
# Location of migration scripts (resolved relative to this file).
script_location = %(here)s/migrations

# Make the repo root importable so `from db_schema import models` works in env.py.
prepend_sys_path = %(here)s/..

# Fallback URL; overridden by DATABASE_URL when present.
sqlalchemy.url = postgresql+psycopg://localhost:5432/cahiers


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
